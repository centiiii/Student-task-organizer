<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task Organizer</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="privacy.html">Privacy</a></li>
            </ul>
        </nav>
        <h1>Student Task Organizer</h1>
    </header>

    <main>
        <section class="task-form">
            <h2>Add Task</h2>
            <form id="task-form">
                <div class="form-group">
                    <label for="title">Title:</label>
                    <input type="text" id="title" name="title" required>
                </div>
                <div class="form-group">
                    <label for="subject">Subject:</label>
                    <input type="text" id="subject" name="subject" required>
                </div>
                <div class="form-group">
                    <label for="due-date">Due Date:</label>
                    <input type="date" id="due-date" name="due-date">
                </div>
                <div class="form-group">
                    <label for="priority">Priority:</label>
                    <select id="priority" name="priority">
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>
                <button type="submit" id="submit-button">Add Task</button>
                <button type="button" id="cancel-button" style="display: none; margin-left: 10px;">Cancel</button>
            </form>
            <p id="form-error"></p>
        </section>

        <section class="task-section">
            <section class="task-filter">
                <h2>Filter Tasks</h2>
                <input type="text" id="subject-filter" placeholder="Filter by subject...">
            </section>

            <section class="task-list">
                <h2>Task List</h2>
                <ul id="task-list"></ul>
            </section>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Student Task Organizer. All rights reserved.</p>
    </footer>

    <script src="js/script.js" defer></script>
</body>
</html>
